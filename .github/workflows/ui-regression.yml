name: UI Regression

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'tests/**'
      - 'playwright.config.js'
      - 'package.json'
      - 'server.mjs'
  workflow_dispatch:

jobs:
  board-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json
      - run: npm install
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
