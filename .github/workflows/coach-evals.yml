name: Coach Evals

on:
  workflow_dispatch:
    inputs:
      max_cases:
        description: Maximum eval cases to run
        required: false
        default: "20"
      use_judge:
        description: Run structured LLM judge
        required: false
        default: true
        type: boolean

jobs:
  coach-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ secrets.OPENAI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json
      - run: npm install
      - name: Install Stockfish
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish
      - name: Run coach evals
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STOCKFISH_PATH: /usr/games/stockfish
          OPENAI_COACH_MODEL: gpt-5.6-sol
          OPENAI_EVAL_MODEL: gpt-5.6-sol
        run: |
          if [ "${{ inputs.use_judge }}" = "true" ]; then
            npm run eval:coach -- --judge --max=${{ inputs.max_cases }}
          else
            npm run eval:coach -- --max=${{ inputs.max_cases }}
          fi
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coach-eval-report
          path: evals/results/
          if-no-files-found: warn
